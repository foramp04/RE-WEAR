<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RE:WEAR | Sign Up</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="signup.css"
    >

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="logo">
                RE:<span>WEAR</span>
            </div>

            <div class="tagline">
                Rewear. Restyle. Repeat.
            </div>


            <h1>
                Create Your Account
            </h1>

            <p class="subtitle">
                Start building your Re:Space
            </p>


            <form id="signup-form">

                <div class="input-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Your full name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="At least 6 characters"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="auth-button"
                    id="signup-btn"
                >
                    Sign Up
                </button>


                <div
                    class="error-message"
                    id="error-message"
                ></div>

            </form>


            <p>
                 Already have an account?
                <a href="login.html"> Log In </a>
            </p>

        </div>

    </div>


    <script type="module" src="signup.js"></script>

</body>
</html>
