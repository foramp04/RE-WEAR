<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RE:WEAR | Wardrobe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER-->

    <header class="top-header">

        <div class="logo">
            RE:<span>WEAR</span>
        </div>

        <div class="tagline">
            Rewear. Restyle. Repeat.
        </div>

    </header>

    <div class="app-container">

        <!-- MENU -->

        <aside class="sidebar">

            <div class="sidebar-title">
                <strong>Your Re:Space</strong>

                <button class="menu-button" id="menuButton">
                    ☰
                </button>
            </div>


            <nav class="navigation">

                <button class="nav-item active">
                    <span class="nav-icon">♧</span>
                    Wardrobe
                </button>

                <button class="nav-item">
                    <span class="nav-icon">✧</span>
                    Outfits
                </button>

                <button class="nav-item">
                    <span class="nav-icon">▣</span>
                    Calendar
                </button>

                <button class="nav-item">
                    <span class="nav-icon">♧</span>
                    Shared Closet
                </button>

                <button class="nav-item">
                    <span class="nav-icon">◯</span>
                    Profile
                </button>

            </nav>


            <button class="sign-out" id="signOutButton">
                ↪
                <span>Sign Out</span>
            </button>

        </aside>


        <!-- MAIN PAGE CONTENT -->

        <main class="main-content">

            <div class="page-heading">

                <div>
                    <h1>
                        WARDROBE
                        <span>|</span>
                        <em>YOUR COLLECTION</em>
                    </h1>
                </div>

                <button class="add-button" id="openModal">
                    <span>+</span>
                    Add Item
                </button>

            </div>


            <!-- CATEGORIES -->

            <div class="category-filters">

                <button class="category-button active" data-category="All">
                    All Categories
                </button>

                <button class="category-button" data-category="Top">
                    Top
                </button>

                <button class="category-button" data-category="Bottom">
                    Bottom
                </button>

                <button class="category-button" data-category="Dress">
                    Dress
                </button>

                <button class="category-button" data-category="Outerwear">
                    Outerwear
                </button>

                <button class="category-button" data-category="Accessories">
                    Accessories
                </button>

                <button class="category-button" data-category="Shoes">
                    Shoes
                </button>

            </div>


            <!-- LOADING -->

            <div class="loading" id="loading">
                Loading your wardrobe...
            </div>


            <!-- WARDROBE -->

            <section class="wardrobe-grid" id="wardrobeGrid"></section>


            <!-- EMPTY STATE -->

            <div class="empty-state" id="emptyState">

                <h2>Your wardrobe is empty</h2>

                <p>
                    Add your first piece to get started.
                </p>

                <button class="empty-add-button" id="emptyAddButton">
                    + Add your first item
                </button>

            </div>

        </main>

    </div>


    <footer>

        <div class="footer-links">
            <span>About</span>
            <span>Contact</span>
            <span>Privacy Policy</span>
        </div>

        <div>
            © 2026
        </div>

    </footer>

    <div class="modal-overlay" id="modal">

        <div class="modal">

            <button class="close-modal" id="closeModal">
                ×
            </button>


            <h2>New piece</h2>


            <!-- PHOTO -->

            <div class="form-group">

                <label>
                    Photo
                </label>

                <input
                    type="file"
                    id="photo"
                    accept="image/*"
                >

                <p class="help-text">
                    Upload a photo of your clothing item.
                </p>

                <div class="image-preview" id="imagePreview"></div>

            </div>


            <!-- NAME -->

            <div class="form-group">

                <label>
                    Name *
                </label>

                <input
                    type="text"
                    id="itemName"
                    placeholder="Linen shirt"
                    required
                >

            </div>


            <!--CATEGORY -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Category *
                    </label>

                    <select id="category">

                        <option value="">
                            Select category
                        </option>

                        <option value="Top">
                            Top
                        </option>

                        <option value="Bottom">
                            Bottom
                        </option>

                        <option value="Dress">
                            Dress
                        </option>

                        <option value="Outerwear">
                            Outerwear
                        </option>

                        <option value="Accessories">
                            Accessories
                        </option>

                        <option value="Shoes">
                            Shoes
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Season
                    </label>

                    <select id="season">

                        <option value="">
                            Select season
                        </option>

                        <option value="Summer">
                            Summer
                        </option>

                        <option value="Autumn">
                            Autumn
                        </option>

                        <option value="Winter">
                            Winter
                        </option>

                        <option value="Spring">
                            Spring
                        </option>

                        <option value="All Season">
                            All Season
                        </option>

                    </select>

                </div>

            </div>


            <!-- COLOUR & BRAND -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Colour
                    </label>

                    <input
                        type="text"
                        id="color"
                        placeholder="Ivory"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Brand
                    </label>

                    <input
                        type="text"
                        id="brand"
                        placeholder="Glassons"
                    >

                </div>

            </div>


            <!-- NOTES -->

            <div class="form-group">

                <label>
                    Notes
                </label>

                <textarea
                    id="notes"
                    placeholder="Anything you want to remember about this piece..."
                ></textarea>

            </div>


            <!-- SAVE -->

            <button
                class="save-button"
                id="saveButton"
            >
                Save piece
            </button>


            <div
                class="upload-status"
                id="uploadStatus"
            ></div>

        </div>

    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
